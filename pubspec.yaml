name: my_auth_app
description: "Firebase Auth, Riverpod, GoRouter və Image Picker inteqrasiyalı Flutter tətbiqi."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Firebase
  firebase_core: ^3.0.0
  firebase_auth: ^5.0.0

  # State Management & Routing
  flutter_riverpod: ^2.5.1
  go_router: ^14.0.0

  # Cihaz funksiyası (Qalereya/Kamera)
  image_picker: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
